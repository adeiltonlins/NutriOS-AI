name: NutriOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
      ADMIN_TOKEN: ci-admin-token
      COOKIE_SECURE: "false"
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app tests

      - name: RBAC and tenant isolation
        run: >-
          python -m pytest -q
          tests/test_auth_unit.py
          tests/test_tenant_isolation_v31.py
          tests/test_dashboard_search_security.py
          tests/test_observability.py

      - name: Existing regression smoke suite
        run: >-
          python -m pytest -q
          tests/test_audit_regressions.py
          tests/test_patient_access.py
          tests/test_advanced_clinical.py
          tests/test_chat_resilience.py
