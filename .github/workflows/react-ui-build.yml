name: Validate NutriOS React integration

on:
  push:
    branches:
      - feature/ai-studio-ui-integration
      - staging/ai-studio-ui-complete
    paths:
      - 'frontend/**'
      - 'scripts/build-react-ui.sh'
      - 'app/react_ui_api.py'
      - 'app/react_ui_routes.py'
      - 'app/__init__.py'
      - '.github/workflows/react-ui-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Python integration syntax
        run: python -m py_compile app/react_ui_api.py app/react_ui_routes.py app/__init__.py
      - name: Materialize, typecheck and build full AI Studio frontend
        run: bash scripts/build-react-ui.sh
      - name: Verify build output
        run: test -f app/static/react-ui/index.html

# staging validation trigger: canonical UI archive assembled
