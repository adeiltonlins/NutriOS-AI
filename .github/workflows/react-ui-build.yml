name: Build and publish NutriOS React integration

on:
  push:
    branches:
      - feature/ai-studio-ui-integration
      - staging/ai-studio-ui-complete
    paths:
      - 'frontend/**'
      - 'scripts/build-react-ui.sh'
      - 'app/react_ui_api.py'
      - 'app/react_ui_routes.py'
      - 'app/meal_template_library_v2.py'
      - 'app/workout_media_v2.py'
      - 'app/static/nutrios-diet-models-fix.js'
      - 'app/static/nutrios-library-workout-v3.js'
      - 'app/__init__.py'
      - 'migrations/025_workout_exercise_media.sql'
      - '.github/workflows/react-ui-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Python integration syntax
        run: python -m py_compile app/react_ui_api.py app/react_ui_routes.py app/meal_template_library_v2.py app/workout_media_v2.py app/__init__.py
      - name: Materialize, typecheck and build full AI Studio frontend
        run: bash scripts/build-react-ui.sh
      - name: Verify library and workout media patches are in build
        run: |
          test -f app/static/react-ui/index.html
          grep -q 'nutrios-diet-models-fix.js?v=20260902g' app/static/react-ui/index.html
          grep -q 'nutrios-library-workout-v3.js?v=20260902g' app/static/react-ui/index.html
          test -f app/static/nutrios-diet-models-fix.js
          test -f app/static/nutrios-library-workout-v3.js
      - name: Publish generated React bundle to branch
        shell: bash
        run: |
          if git diff --quiet -- app/static/react-ui; then
            echo 'React bundle unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f app/static/react-ui
          git commit -m 'build: publish React UI with diet library and workout media'
          git push origin HEAD:${{ github.ref_name }}
