</head><body><main class="wrap"><a href="/app">â† Voltar</a><h1>CRM de pacientes</h1><p class="muted">Arraste os cartÃµes entre as etapas para atualizar o atendimento.</p><section id="board" class="board"></section></main><script>
const stages=[['new','Novos'],['awaiting_payment','Aguardando pagamento'],['awaiting_verification','Conferir pagamento'],['payment_confirmed','Pagamento confirmado'],['contacted','Contatados'],['anamnesis_sent','Anamnese'],['scheduled','Agendados']],esc=s=>String(s??'').replace(/[&<>"']/g,'');let leads=[];async function move(id,stage){const r=await fetch('/app/api/leads/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'set_stage',stage})});if(!r.ok)alert('NÃ£o foi possÃ­vel mover este lead.');load()}function render(){board.innerHTML=stages.map(([id,label])=>{const rows=leads.filter(x=>(x.workflow_status||'new')===id);return `<div class="column" data-stage="${id}"><div class="head">${label}<span class="count">${rows.length}</span></div><div class="cards">${rows.map(v=>`<article class="lead" draggable="true" data-id="${esc(v.session_id)}"><b>${esc(v.lead_name||'Visitante')}</b><div class="muted">${esc(v.lead_phone||'WhatsApp nÃ£o informado')}</div><div class="muted">${esc(v.lead_summary||'Sem resumo')}</div><span class="tag">${esc(v.lead_source||'direto')}</span></article>`).join('')||'<div class="empty">Solte um lead aqui</div>'}</div></div>`}).join('');document.querySelectorAll('.lead').forEach(x=>x.ondragstart=e=>e.dataTransfer.setData('text/plain',x.dataset.id));document.querySelectorAll('.column').forEach(x=>{x.ondragover=e=>e.preventDefault();x.ondrop=e=>{e.preventDefault();move(e.dataTransfer.getData('text/plain'),x.dataset.stage)}})}async function load(){const r=await fetch('/app/api/leads');if(!r.ok){location='/login';return}leads=await r.json();render()}load();
</script>
