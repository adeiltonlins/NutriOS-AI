ue="front">Frente</option><option value="side">Lateral</option><option value="back">Costas</option><option value="other">Outro</option></select></label><label>Data<input type="date" name="captured_at"></label><label>Foto<input type="file" name="file" accept="image/jpeg,image/png,image/webp" required></label><label>Observações<textarea name="notes"></textarea></label><button>Enviar</button></form></article><article class="panel"><h2>Comparativo</h2><div id="pList" class="photos"></div></article></section></main><script src="/static/advanced-clinical.js"></script>
