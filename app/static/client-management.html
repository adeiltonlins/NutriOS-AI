<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão — NutriOS</title><style>body{margin:0;background:#0b1a11;color:#e5f6ea;font:15px system-ui}.wrap{max-width:1150px;margin:auto;padding:28px}a{color:#e5f6ea;text-decoration:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button,.btn{padding:11px 15px;border:1px solid #c8dccf;border-radius:10px;background:#17301f;color:white;cursor:pointer}.tabs button.active,.primary{background:linear-gradient(90deg,#168f43,#64cf86)}.panel{background:#12271a;border:1px solid #17301f;border-radius:17px;padding:20px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px}.card{border:1px solid #205f36;border-radius:13px;padding:15px;background:#0b1a11}.muted{color:#64cf86}.row{display:flex;gap:9px;flex-wrap:wrap}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;background:#0b1a11;color:white;border:1px solid #c8dccf;border-radius:9px}dialog{background:#12271a;color:white;border:1px solid #c8dccf;border-radius:16px;padding:22px;width:min(90vw,480px)}button{cursor:pointer}</style><link rel="stylesheet" href="/static/nutrios-premium.css">




<link rel="stylesheet" href="/static/nutrios-v22-unified.css?v=22">
</head><body><main class="wrap"><a href="/app">← Voltar</a><h1>Serviços e agenda</h1><div class="tabs"><button class="active" data-tab="services">Serviços e planos</button><button data-tab="availability">Disponibilidade</button><button data-tab="appointments">Consultas</button><button data-tab="anamneses">Anamneses</button></div><section id="services" class="view active panel"><div class="row" style="justify-content:space-between"><h2>Meus serviços</h2><button class="btn primary" onclick="serviceDialog.showModal()">+ Novo serviço</button></div><div id="serviceList" class="grid"></div></section><section id="availability" class="view panel"><h2>Horários disponíveis</h2><form id="availabilityForm" class="grid"><label>Dia<select name="weekday"><option value="0">Segunda</option><option value="1">Terça</option><option value="2">Quarta</option><option value="3">Quinta</option><option value="4">Sexta</option><option value="5">Sábado</option><option value="6">Domingo</option></select></label><label>Início<input name="start_time" type="time" required></label><label>Final<input name="end_time" type="time" required></label><label>Duração da consulta<input name="slot_minutes" type="number" value="60" min="15" max="240"></label><button class="btn primary">Adicionar horário</button></form><div id="availabilityList" class="grid"></div></section><section id="appointments" class="view panel"><h2>Próximas consultas</h2><div id="appointmentList" class="grid"></div></section><section id="anamneses" class="view panel"><h2>Anamneses recebidas</h2><div id="anamnesisList" class="grid"></div></section></main><dialog id="serviceDialog"><form id="serviceForm"><h2>Novo serviço</h2><label>Nome<input name="name" required></label><label>Descrição<textarea name="description"></textarea></label><label>Valor<input name="price" type="number" step="0.01" min="0" required></label><label>Link de pagamento<input name="payment_url" type="url"></label><button type="button" class="btn" onclick="serviceDialog.close()">Cancelar</button> <button class="btn primary">Salvar</button></form></dialog><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,''),days=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});async function api(url,opt){const r=await fetch(url,opt);if(!r.ok)throw Error((await r.json().catch(()=>({}))).detail||'Erro');return r.json()}async function load(){const [s,v,a,n]=await Promise.all([api('/app/api/services'),api('/app/api/availability'),api('/app/api/appointments'),api('/app/api/anamneses')]);serviceList.innerHTML=s.map(x=>`<article class="card"><b>${esc(x.name)}</b><p>${esc(x.description)}</p><strong>R$ ${Number(x.price).toFixed(2)}</strong><p><button class="btn" onclick="delService('${x.id}')">Excluir</button></p></article>`).join('')||'<p class="muted">Cadastre seu primeiro serviço.</p>';availabilityList.innerHTML=v.map(x=>`<article class="card"><b>${days[x.weekday]}</b><p>${String(x.start_time).slice(0,5)} às ${String(x.end_time).slice(0,5)} • ${x.slot_minutes} min</p><button class="btn" onclick="delAvailability('${x.id}')">Excluir</button></article>`).join('')||'<p class="muted">Nenhum horário cadastrado.</p>';appointmentList.innerHTML=a.map(x=>`<article class="card"><b>${esc(x.patient_name)}</b><p>${new Date(x.starts_at).toLocaleString('pt-BR')}</p><span class="muted">${esc(x.patient_phone)} • ${esc(x.status)}</span></article>`).join('')||'<p class="muted">Nenhuma consulta agendada.</p>';anamnesisList.innerHTML=n.map(x=>`<article class="card"><b>Anamnese recebida</b><p>${new Date(x.submitted_at).toLocaleString('pt-BR')}</p>${Object.entries(x.answers||{}).map(([k,v])=>`<p><strong>${esc(k)}:</strong> ${esc(v)}</p>`).join('')}</article>`).join('')||'<p class="muted">Nenhuma anamnese recebida.</p>'}serviceForm.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.price=Number(d.price);d.active=true;await api('/app/api/services',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});serviceDialog.close();e.target.reset();load()};availabilityForm.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.weekday=Number(d.weekday);d.slot_minutes=Number(d.slot_minutes);await api('/app/api/availability',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});e.target.reset();load()};async function delService(id){if(confirm('Excluir serviço?')){await api('/app/api/services/'+id,{method:'DELETE'});load()}}async function delAvailability(id){await api('/app/api/availability/'+id,{method:'DELETE'});load()}load().catch(()=>location='/login');
</script>
<script src="/static/nutrios-v22-theme.js?v=22"></script>
</body></html>
