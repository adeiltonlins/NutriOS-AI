<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações — NutriBot AI</title><style>body{margin:0;background:#071020;color:#eff5ff;font:15px system-ui}.wrap{max-width:850px;margin:auto;padding:28px}a{color:#8eaeff;text-decoration:none}.panel{margin-top:24px;padding:25px;background:#101a30;border:1px solid #293c62;border-radius:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:16px}.field.full{grid-column:1/-1}label{display:block;margin-bottom:7px;color:#b9c7df}input,textarea{width:100%;box-sizing:border-box;padding:12px;background:#081225;color:white;border:1px solid #344d78;border-radius:10px}textarea{min-height:100px;resize:vertical}button{padding:12px 18px;border:0;border-radius:10px;background:linear-gradient(90deg,#4b7dff,#8958f7);color:#fff;font-weight:800;cursor:pointer}.meta{color:#9baccc;margin:6px 0}.ok{color:#54e4ad;min-height:22px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/app">← Voltar</a><h1>Configurações da minha IA</h1><div class="meta" id="account"></div><form class="panel" id="form"><div class="grid"><div class="field"><label>Nome profissional</label><input name="nome" placeholder="Dra. Maria"></div><div class="field"><label>Especialidade</label><input name="especialidade" placeholder="Emagrecimento e nutrição clínica"></div><div class="field"><label>WhatsApp</label><input name="whatsapp" placeholder="https://wa.me/55..."></div><div class="field"><label>Link de consulta</label><input name="link_consulta" placeholder="https://..."></div><div class="field"><label>Nome da assistente</label><input name="identidade_ia" placeholder="Assistente da Dra. Maria"></div><div class="field"><label>Horário de atendimento</label><input name="horario" placeholder="Segunda a sexta, 8h às 18h"></div><div class="field full"><label>Mensagem inicial</label><textarea name="mensagem_inicial"></textarea></div><div class="field full"><label>Instruções adicionais da IA</label><textarea name="prompt" placeholder="Tom de voz, público atendido e orientações da clínica"></textarea></div></div><div class="ok" id="msg"></div><button>Salvar configurações</button></form></main><script>const fields=['nome','especialidade','whatsapp','link_consulta','identidade_ia','horario','mensagem_inicial','prompt'];async function init(){const r=await fetch('/app/api/configuracoes');if(!r.ok){location='/login';return}const x=await r.json();document.querySelector('#account').textContent=`Plano: ${x.plan||'—'} • Validade: ${x.expires_at?new Date(x.expires_at).toLocaleDateString('pt-BR'):'sem data'}`;fields.forEach(k=>document.querySelector(`[name=${k}]`).value=x.ai_config[k]||'')}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const data={};fields.forEach(k=>data[k]=document.querySelector(`[name=${k}]`).value.trim());const r=await fetch('/app/api/configuracoes',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});document.querySelector('#msg').textContent=r.ok?'Configurações salvas com sucesso.':'Não foi possível salvar.'};init()</script></body></html>
