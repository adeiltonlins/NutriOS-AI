<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Área do paciente — NutriBot AI</title>
<style>
*{box-sizing:border-box}:root{--brand:#4f7cff}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--brand) 35%,#07101f),#050a15 58%);color:#f5f8ff;font:15px Inter,system-ui}.card{width:min(92vw,480px);padding:36px;border:1px solid #29436e;border-radius:28px;background:#0b1629ee;box-shadow:0 35px 100px #0009}.identity{display:flex;align-items:center;gap:14px;padding:13px;border:1px solid #263d63;border-radius:18px;background:#111f36}.photo{width:58px;height:58px;flex:none;border-radius:17px;background:linear-gradient(135deg,var(--brand),#35d4ba);display:grid;place-items:center;overflow:hidden;font-weight:900}.photo img{width:100%;height:100%;object-fit:cover}.muted,p{color:#9cb0d0;line-height:1.55}.eyebrow{margin-top:27px;color:#68dfcc;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:850}h1{font-size:32px;margin:8px 0}label{display:block;margin:24px 0 8px}input{width:100%;padding:16px;border-radius:13px;border:1px solid #385681;background:#061025;color:#fff;font:17px monospace;text-transform:uppercase;outline:none}input:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 16%,transparent)}button{width:100%;padding:15px;margin-top:14px;border:0;border-radius:13px;background:linear-gradient(90deg,var(--brand),#8b5cf6);color:#fff;font-weight:850;font-size:16px;cursor:pointer}.msg{min-height:20px;color:#ff95a9}.back{display:block;text-align:center;color:#9bb8e7;text-decoration:none;margin-top:18px}.hidden{display:none}
</style></head><body><main class="card"><section id="identity" class="identity hidden"><div class="photo" id="photo">NB</div><div><b id="professional">Seu nutricionista</b><div class="muted" id="specialty">Acompanhamento nutricional</div></div></section><div class="eyebrow">Acompanhamento privado</div><h1>Área do paciente</h1><p>Entre no canal liberado pelo seu nutricionista enquanto seu acompanhamento estiver ativo.</p><form id="form"><label>Código de acesso</label><input name="code" placeholder="PACI-XXXX-XXXX" required autocomplete="one-time-code"><button>Entrar no acompanhamento</button></form><p class="msg" id="msg"></p><p>Seu código é individual. Se o plano vencer, solicite a renovação diretamente ao profissional.</p><a id="back" class="back" href="/">← Voltar</a></main><script>
const params=new URLSearchParams(location.search),slug=params.get('nutri');
const esc=s=>String(s||'').replace(/[<>&"]/g,'');
async function brand(){if(!slug)return;const r=await fetch('/public/clientes/'+encodeURIComponent(slug));if(!r.ok)return;const x=await r.json();document.documentElement.style.setProperty('--brand',x.cor_principal||'#4f7cff');professional.textContent=x.nome||'Seu nutricionista';specialty.textContent=x.especialidade||'Acompanhamento nutricional';document.title=`Área do paciente — ${x.nome}`;identity.classList.remove('hidden');back.href='/n/'+encodeURIComponent(slug);if(x.logo_url){const img=document.createElement('img');img.src=x.logo_url;img.alt='Foto de '+esc(x.nome);photo.textContent='';photo.appendChild(img)}}brand();
form.onsubmit=async e=>{e.preventDefault();msg.textContent='';const button=e.target.querySelector('button');button.disabled=true;button.textContent='Verificando...';const r=await fetch('/paciente/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:e.target.code.value})});const x=await r.json().catch(()=>({}));button.disabled=false;button.textContent='Entrar no acompanhamento';if(r.ok)location=x.redirect;else msg.textContent=x.detail||'Acesso inválido ou expirado.'}
</script></body></html>
