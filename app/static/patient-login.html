<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área do paciente — NutriBot AI</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,#173b70,#050a15 55%);color:#f5f8ff;font:15px system-ui}.card{width:min(92vw,460px);padding:36px;border:1px solid #2a4269;border-radius:25px;background:#0c1628ed;box-shadow:0 30px 90px #0009}.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#4d82ff,#41d7c3);font-size:22px}.eyebrow{margin-top:24px;color:#61dcca;text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:800}h1{font-size:31px;margin:8px 0}p{color:#99accb;line-height:1.55}label{display:block;margin:24px 0 8px}input{width:100%;padding:15px;border-radius:12px;border:1px solid #36527e;background:#071124;color:#fff;font:17px monospace;text-transform:uppercase}button{width:100%;padding:14px;margin-top:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#4c7dff,#8b5cf6);color:#fff;font-weight:850;font-size:16px}.msg{min-height:20px;color:#ff95a9}</style></head><body><main class="card"><div class="mark">✦</div><div class="eyebrow">Acompanhamento privado</div><h1>Área do paciente</h1><p>Acesse o assistente liberado pelo seu nutricionista durante o período do seu acompanhamento.</p><form id="form"><label>Código de acesso</label><input name="code" placeholder="PACI-XXXX-XXXX" required autocomplete="one-time-code"><button>Entrar no acompanhamento</button></form><p class="msg" id="msg"></p><p>Seu código é individual. Quando o plano vencer, solicite a renovação ao profissional.</p></main><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent='';const r=await fetch('/paciente/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:e.target.code.value})});const x=await r.json().catch(()=>({}));if(r.ok)location=x.redirect;else msg.textContent=x.detail||'Acesso inválido ou expirado.'}</script></body></html>
