<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NutriOS — Área profissional</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#172554,#050816 55%);font-family:Inter,system-ui;color:#eaf1ff}.card{width:min(92%,440px);padding:34px;border:1px solid #26355f;border-radius:24px;background:#0d1429e8;box-shadow:0 30px 80px #0008}.logo{color:#73a7ff;font-weight:800}h1{margin:12px 0 6px;font-size:30px}p{color:#9daac8}.tabs{display:flex;background:#080f20;border-radius:11px;padding:4px;margin:22px 0}.tabs button{flex:1;margin:0;background:transparent;color:#9daac8}.tabs button.on{background:#1d2b4a;color:white}label{display:block;margin:15px 0 7px}input{width:100%;padding:14px;border-radius:11px;border:1px solid #33446f;background:#090f20;color:white;font-size:16px}button{width:100%;margin-top:15px;padding:14px;border:0;border-radius:11px;background:linear-gradient(90deg,#3978ff,#8b5cf6);color:white;font-weight:800;font-size:15px;cursor:pointer}.msg{min-height:20px;color:#ff9baf;font-size:14px}.hidden{display:none}.back{display:block;text-align:center;color:#89a9e8;text-decoration:none;margin-top:18px}</style><link rel="stylesheet" href="/static/nutrios-premium.css"></head><body><main class="card"><div class="logo">NutriOS</div><h1>Área profissional</h1><p>Acesso de nutricionistas e administração.</p><div class="tabs"><button id="passwordTab" class="on" type="button">Já tenho senha</button><button id="codeTab" type="button">Primeiro acesso</button></div><form id="passwordForm"><label>Identificador ou e-mail</label><input name="identifier" autocomplete="username" required><label>Senha</label><input name="password" type="password" autocomplete="current-password" minlength="10" required><button>Entrar</button></form><form id="codeForm" class="hidden"><label>Código de acesso</label><input name="code" placeholder="NTRI-XXXX-XXXX" maxlength="256" autocomplete="one-time-code" required><button>Entrar com código</button><p>O código temporário é fornecido pelo administrador.</p></form><p class="msg" id="msg"></p><a class="back" href="/">← Voltar ao assistente</a></main><script>const p=document.querySelector('#passwordForm'),c=document.querySelector('#codeForm'),pt=document.querySelector('#passwordTab'),ct=document.querySelector('#codeTab'),m=document.querySelector('#msg');function tab(code){p.classList.toggle('hidden',code);c.classList.toggle('hidden',!code);pt.classList.toggle('on',!code);ct.classList.toggle('on',code);m.textContent=''}pt.onclick=()=>tab(false);ct.onclick=()=>tab(true);async function send(body){m.textContent='';const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){location.href=(await r.json()).redirect}else{m.textContent='Acesso inválido, expirado ou indisponível.'}}p.onsubmit=e=>{e.preventDefault();send({identifier:e.target.identifier.value,password:e.target.password.value})};c.onsubmit=e=>{e.preventDefault();send({code:e.target.code.value})}</script></body></html>
