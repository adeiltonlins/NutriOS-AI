<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NutriBot AI — Área exclusiva</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#172554,#050816 55%);font-family:Inter,system-ui;color:#eaf1ff}.card{width:min(92%,420px);padding:34px;border:1px solid #26355f;border-radius:24px;background:#0d1429e8;box-shadow:0 30px 80px #0008}.logo{color:#73a7ff;font-weight:800}h1{margin:12px 0 6px;font-size:30px}p{color:#9daac8}label{display:block;margin:26px 0 8px}input{width:100%;padding:15px;border-radius:12px;border:1px solid #33446f;background:#090f20;color:white;font-size:16px;text-transform:uppercase}button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;background:linear-gradient(90deg,#3978ff,#8b5cf6);color:white;font-weight:800;font-size:16px;cursor:pointer}.msg{min-height:20px;color:#ff9baf;font-size:14px}</style></head><body><main class="card"><div class="logo">NutriBot AI</div><h1>Área exclusiva</h1><p>Acesse seu ambiente de atendimento inteligente.</p><form id="f"><label for="code">Código de acesso</label><input id="code" name="code" placeholder="NTRI-XXXX-XXXX" maxlength="14" autocomplete="one-time-code" required><button>Entrar</button><p class="msg" id="msg"></p></form><p>Seu código de acesso é fornecido pelo administrador.</p></main><script>document.querySelector('#f').onsubmit=async(e)=>{e.preventDefault();const m=document.querySelector('#msg');m.textContent='';const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:e.target.code.value})});if(r.ok){location.href=(await r.json()).redirect}else{m.textContent='Código inválido, expirado ou indisponível.'}}</script></body></html>
