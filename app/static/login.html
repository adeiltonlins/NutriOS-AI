</head><body class="login-page"><a class="ui-skip-link" href="#loginContent">Ir para o acesso</a><main class="card" id="loginContent"><div class="logo">NutriOS</div><h1>Área profissional</h1><p>Acesso seguro para nutricionistas e administração.</p><div class="tabs" role="tablist" aria-label="Forma de acesso"><button id="passwordTab" class="on" type="button" role="tab" aria-selected="true" aria-controls="passwordForm">Já tenho senha</button><button id="codeTab" type="button" role="tab" aria-selected="false" aria-controls="codeForm">Primeiro acesso</button></div><form id="passwordForm"><label for="professionalIdentifier">Identificador ou e-mail</label><input id="professionalIdentifier" name="identifier" autocomplete="username" required><label for="professionalPassword">Senha</label><input id="professionalPassword" name="password" type="password" autocomplete="current-password" minlength="10" required><button type="submit">Entrar</button></form><form id="codeForm" class="hidden"><label for="professionalCode">Código de acesso</label><input id="professionalCode" name="code" placeholder="NTRI-XXXX-XXXX" maxlength="256" autocomplete="one-time-code" required><button type="submit">Entrar com código</button><p>O código temporário é fornecido pelo administrador.</p></form><p class="msg" id="msg" role="status" aria-live="polite"></p><a class="back" href="/">← Voltar ao assistente</a></main><script>const p=document.querySelector('#passwordForm'),c=document.querySelector('#codeForm'),pt=document.querySelector('#passwordTab'),ct=document.querySelector('#codeTab'),m=document.querySelector('#msg');function tab(code){p.classList.toggle('hidden',code);c.classList.toggle('hidden',!code);pt.classList.toggle('on',!code);ct.classList.toggle('on',code);pt.setAttribute('aria-selected',String(!code));ct.setAttribute('aria-selected',String(code));m.textContent='';(code?c:p).querySelector('input').focus()}pt.onclick=()=>tab(false);ct.onclick=()=>tab(true);async function send(body,form){const button=form.querySelector('button[type="submit"]'),label=button.textContent;m.textContent='';button.disabled=true;button.textContent='Entrando...';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){location.href=(await r.json()).redirect;return}m.textContent='Acesso inválido, expirado ou indisponível.'}catch{m.textContent='Não foi possível conectar. Tente novamente.'}finally{button.disabled=false;button.textContent=label}}p.onsubmit=e=>{e.preventDefault();send({identifier:e.target.identifier.value,password:e.target.password.value},e.target)};c.onsubmit=e=>{e.preventDefault();send({code:e.target.code.value},e.target)}</script>
