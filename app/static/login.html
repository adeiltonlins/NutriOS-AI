<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NutriOS — Área profissional</title>
<style id="nutrios-login-v21">
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 15%,rgba(74,196,107,.10),transparent 30%),var(--u-bg)!important;font-family:Inter,system-ui;color:var(--u-text)!important}
.card{width:min(92%,460px);padding:34px;border:1px solid var(--u-line)!important;border-radius:22px;background:var(--u-surface)!important;box-shadow:var(--u-shadow)!important}
.logo{color:var(--u-greenDark)!important;font-weight:900;font-size:19px}
h1{margin:12px 0 6px;font-size:31px;color:var(--u-text)!important}
p{color:var(--u-muted)!important}
.tabs{display:flex;background:var(--u-soft)!important;border:1px solid var(--u-line)!important;border-radius:12px;padding:4px;margin:22px 0}
.tabs button{flex:1;margin:0;background:transparent!important;color:var(--u-muted)!important;border:0!important;padding:12px!important}
.tabs button.on{background:var(--u-mint)!important;color:var(--u-green)!important}
label{display:block;margin:15px 0 7px;color:var(--u-text)!important;font-weight:650}
input{width:100%;padding:14px;border-radius:11px;border:1px solid var(--u-line2)!important;background:var(--u-surface)!important;color:var(--u-text)!important;font-size:16px}
form>button{width:100%;margin-top:15px;padding:14px;border:1px solid var(--u-green)!important;border-radius:11px;background:linear-gradient(90deg,var(--u-green),var(--u-green2))!important;color:white!important;font-weight:800;font-size:15px;cursor:pointer}
.msg{min-height:20px;color:#c94a4a!important;font-size:14px}.hidden{display:none}.back{display:block;text-align:center;color:var(--u-green)!important;text-decoration:none;margin-top:18px}
</style>
<link rel="stylesheet" href="/static/nutrios-final-v21.css?v=21">
</head><body class="login-page"><main class="card"><div class="logo">NutriOS</div><h1>Área profissional</h1><p>Acesso de nutricionistas e administração.</p><div class="tabs"><button id="passwordTab" class="on" type="button">Já tenho senha</button><button id="codeTab" type="button">Primeiro acesso</button></div><form id="passwordForm"><label>Identificador ou e-mail</label><input name="identifier" autocomplete="username" required><label>Senha</label><input name="password" type="password" autocomplete="current-password" minlength="10" required><button>Entrar</button></form><form id="codeForm" class="hidden"><label>Código de acesso</label><input name="code" placeholder="NTRI-XXXX-XXXX" maxlength="256" autocomplete="one-time-code" required><button>Entrar com código</button><p>O código temporário é fornecido pelo administrador.</p></form><p class="msg" id="msg"></p><a class="back" href="/">← Voltar ao assistente</a></main><script>const p=document.querySelector('#passwordForm'),c=document.querySelector('#codeForm'),pt=document.querySelector('#passwordTab'),ct=document.querySelector('#codeTab'),m=document.querySelector('#msg');function tab(code){p.classList.toggle('hidden',code);c.classList.toggle('hidden',!code);pt.classList.toggle('on',!code);ct.classList.toggle('on',code);m.textContent=''}pt.onclick=()=>tab(false);ct.onclick=()=>tab(true);async function send(body){m.textContent='';const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){location.href=(await r.json()).redirect}else{m.textContent='Acesso inválido, expirado ou indisponível.'}}p.onsubmit=e=>{e.preventDefault();send({identifier:e.target.identifier.value,password:e.target.password.value})};c.onsubmit=e=>{e.preventDefault();send({code:e.target.code.value})}</script>
<script src="/static/nutrios-theme-v21.js?v=21"></script>
</body></html>
