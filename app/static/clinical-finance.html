<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro clínico — NutriOS</title>
<link rel="stylesheet" href="/static/nutrios-design-system-v1.css?v=4"><link rel="stylesheet" href="/static/nutrios-app-shell.css?v=2"><style>
body{margin:0;background:#0b1a11;color:#e5f6ea;font:15px system-ui}.wrap{max-width:1100px;margin:auto;padding:28px}.back{color:#68df91;text-decoration:none}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;margin:24px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.panel{background:#12271a;border:1px solid #294a35;border-radius:17px;padding:20px}.card span,.muted{color:#a9bcb0}.card strong{display:block;font-size:28px;margin-top:7px}.panel{margin-top:18px}.row{display:grid;grid-template-columns:1fr 150px 130px;gap:12px;padding:14px 0;border-bottom:1px solid #294a35}.row:last-child{border:0}.income{color:#64cf86}.expense{color:#ff899a}.button{background:#43d477;color:#07170d;border-radius:12px;padding:12px 16px;text-decoration:none;font-weight:750}@media(max-width:700px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr}.wrap{padding:18px}}
</style></head><body><main class="wrap"><a class="back" href="/app">← Voltar</a><header class="top"><div><h1>Financeiro clínico</h1><p class="muted">Recebimentos e despesas registrados nos prontuários. Não inclui vendas ainda não confirmadas dos canais de captação.</p></div><a class="button" href="/app/pacientes">Registrar no prontuário</a></header><section class="cards"><article class="card"><span>Recebido</span><strong id="income">—</strong></article><article class="card"><span>Despesas pagas</span><strong id="expense">—</strong></article><article class="card"><span>Saldo realizado</span><strong id="balance">—</strong></article></section><section class="panel"><h2>Histórico clínico</h2><div id="rows" class="muted">Carregando…</div></section></main><script src="/static/nutrios-app-shell.js?v=2"></script><script>
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>window.NutriOSUI?.escapeHtml(s)??String(s??'');
async function loadFinance(){try{const r=await fetch('/app/api/financeiro');if(r.status===401){location.assign('/login');return}if(!r.ok){window.NutriOSUI?.handleResponse(r,loadFinance);rows.textContent='Não foi possível carregar o financeiro agora.';return}const x=await r.json();income.textContent=money(x.income);expense.textContent=money(x.expense);balance.textContent=money(x.balance);rows.innerHTML=x.rows.length?x.rows.map(v=>`<div class="row"><div><b>${esc(v.description||'Lançamento clínico')}</b><div class="muted">${esc(v.status==='paid'?'Pago':v.status==='pending'?'Pendente':v.status||'')}</div></div><b class="${v.kind==='expense'?'expense':'income'}">${money(v.amount)}</b><span>${v.created_at?new Date(v.created_at).toLocaleDateString('pt-BR'):'—'}</span></div>`).join(''):'Nenhum lançamento clínico registrado.'}catch(_){window.NutriOSUI?.showError('Não foi possível conectar ao financeiro. Sua sessão continua ativa.',loadFinance);rows.textContent='Não foi possível carregar o financeiro agora.'}}
loadFinance();
</script></body></html>
