<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversas ao vivo — NutriOS</title><link rel="stylesheet" href="/static/titanium.css"><link rel="stylesheet" href="/static/nutrios-premium.css"><link rel="stylesheet" href="/static/nutribot-ux.css"><script src="/static/nutribot-ux.js"></script><style>
*{box-sizing:border-box}body{margin:0;color:#f2f8f4;font:14px Inter,system-ui}.page{max-width:1450px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.top h1{margin:8px 0 3px}.back{color:#e5f6ea;text-decoration:none}.muted{color:#718077}.live{color:#55e9b4}.layout{display:grid;grid-template-columns:390px 1fr;gap:16px;min-height:720px}.panel{border-radius:22px;overflow:hidden}.list-head,.chat-head{padding:18px 20px;border-bottom:1px solid #17301f}.filters{display:flex;gap:8px;margin-top:12px}.filters button{padding:8px 11px}.sessions{max-height:650px;overflow:auto}.session{display:block;width:100%;padding:16px 18px;border:0;border-bottom:1px solid #17301f;background:transparent;color:#fff;text-align:left;cursor:pointer}.session:hover,.session.on{background:rgba(100,207,134,.11)}.session-row{display:flex;justify-content:space-between;gap:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#718077;margin-right:6px}.dot.on{background:#55e9b4;box-shadow:0 0 13px #55e9b4}.summary{font-size:12px;color:#718077;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.messages{padding:22px;display:flex;flex-direction:column;gap:12px;max-height:620px;overflow:auto}.empty{display:grid;place-items:center;min-height:560px;color:#64cf86;text-align:center}.bubble{max-width:78%;padding:12px 15px;border-radius:16px;white-space:pre-wrap;line-height:1.5}.bubble.bot{align-self:flex-start;background:#17301f;border:1px solid #205f36}.bubble.user{align-self:flex-end;background:linear-gradient(120deg,#168f43,#21ad55)}.who{font-size:10px;font-weight:800;opacity:.68;margin-bottom:5px}.meta{font-size:10px;color:#168f43;margin-top:5px}.badge{display:inline-flex;padding:4px 8px;border-radius:99px;background:#17301f;color:#65e7b6;font-size:11px}@media(max-width:850px){.layout{grid-template-columns:1fr}.sessions{max-height:320px}.page{padding:15px}}
</style><link rel="stylesheet" href="/static/nutrios-premium-v4.css?v=20260813">

</head><body><main class="page"><header class="top"><div><a class="back" href="/app">← Voltar ao painel</a><h1>Conversas em tempo real</h1><p class="muted">Acompanhe as conversas, contexto e atividade em uma única visão. Atualização automática a cada 10 segundos.</p></div><button class="ghost" onclick="load()">Atualizar agora</button></header><div class="layout"><section class="panel"><div class="list-head"><b>Atendimentos</b><div class="filters"><button class="ghost" data-filter="all">Todos</button><button class="ghost" data-filter="online">Online agora</button><button class="ghost" data-filter="hot">Interessados</button></div></div><div id="sessions" class="sessions"></div></section><section class="panel"><div class="chat-head"><b id="chatTitle">Selecione uma conversa</b><div class="muted" id="chatMeta">O histórico aparecerá aqui.</div></div><div id="messages" class="empty"><div><b>Nenhuma conversa selecionada</b><p>Escolha uma pessoa na lista ao lado.</p></div></div></section></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[],selected=null,filter='all';function history(row){const h=row.historico||[];try{return typeof h==='string'?JSON.parse(h):h}catch{return []}}function online(row){const d=new Date(row.atualizado_em||0);return Date.now()-d.getTime()<5*60*1000}function filtered(){return rows.filter(r=>filter==='all'||filter==='online'&&online(r)||filter==='hot'&&(r.quis_agendar||r.lead_status==='quente'))}function renderList(){const data=filtered();sessions.innerHTML=data.length?data.map(r=>`<button class="session ${selected===r.session_id?'on':''}" onclick="openChat('${esc(r.session_id)}')"><div class="session-row"><b><i class="dot ${online(r)?'on':''}"></i>${esc(r.lead_name||'Visitante')}</b><span class="badge">${online(r)?'online':'recente'}</span></div><div class="summary">${esc(r.lead_summary||history(r).filter(x=>x.autor==='user').at(-1)?.texto||'Conversa iniciada')}</div><div class="meta">${esc(r.message_count||0)} mensagens • ${new Date(r.atualizado_em).toLocaleString('pt-BR')}</div></button>`).join(''):'<div class="empty" style="min-height:300px"><p>Nenhuma conversa neste filtro.</p></div>'}function openChat(id){selected=id;renderList();const r=rows.find(x=>x.session_id===id),h=history(r);chatTitle.textContent=r.lead_name||'Visitante';chatMeta.textContent=[r.lead_phone?`WhatsApp: ${r.lead_phone}`:'sem WhatsApp',r.lead_source||'origem direta',online(r)?'online agora':'última atividade '+new Date(r.atualizado_em).toLocaleString('pt-BR')].join(' • ');messages.className='messages';messages.innerHTML=h.length?h.map(m=>`<div class="bubble ${m.autor==='user'?'user':'bot'}"><div class="who">${m.autor==='user'?'VISITANTE':'ASSISTENTE IA'}</div>${esc(m.texto)}</div>`).join(''):'<div class="empty"><p>A conversa ainda não possui mensagens salvas.</p></div>';messages.scrollTop=messages.scrollHeight}async function load(){const r=await fetch('/app/api/leads');if(!r.ok){location='/login';return}rows=await r.json();renderList();if(selected&&rows.some(x=>x.session_id===selected))openChat(selected)}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderList()});load();setInterval(load,10000);
</script>
