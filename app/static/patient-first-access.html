<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crie seu acesso — NutriOS</title><link rel="stylesheet" href="/static/titanium.css"><link rel="stylesheet" href="/static/nutrios-premium.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 15% 10%,#17301f,#0b1a11 48%);color:#f2f8f4;font:15px Inter,system-ui}.card{width:min(100%,520px);padding:34px;border:1px solid #205f36;border-radius:28px;background:#12271add;box-shadow:0 30px 100px #0009}.mark{width:54px;height:54px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(145deg,#22ad55,#168f43);font-weight:900}.eyebrow{margin-top:23px;color:#64cf86;text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:900}h1{margin:7px 0;font-size:34px}p{color:#64cf86;line-height:1.6}label{display:block;margin:16px 0 7px;color:#e5f6ea;font-weight:700}input{width:100%;height:52px;padding:0 15px;border:1px solid #205f36;border-radius:12px;background:#0b1a11;color:#fff;font-size:16px;outline:none}button{width:100%;height:52px;margin-top:19px;border:0;border-radius:13px;background:linear-gradient(90deg,#22ad55,#64cf86);color:#fff;font-weight:900;font-size:16px}.hint{padding:13px;border:1px solid #205f36;border-radius:13px;background:#0b1a11}.msg{color:#ff9bae}</style>

</head><body class="login-page"><main class="card"><div class="mark">NB</div><div class="eyebrow">Convite confirmado</div><h1>Crie seu acesso</h1><p>O código liberou sua conta. Agora escolha suas credenciais para os próximos acessos.</p><div class="hint">Use um e-mail ou identificador que você lembre. A senha deve ter pelo menos 10 caracteres.</div><form id="form"><label>E-mail ou identificador</label><input name="identifier" autocomplete="username" minlength="4" required><label>Nova senha</label><input name="password" type="password" autocomplete="new-password" minlength="10" required><label>Confirme a senha</label><input name="confirm" type="password" autocomplete="new-password" minlength="10" required><button>Salvar e acessar meu portal</button></form><p id="msg" class="msg"></p></main><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent='';if(e.target.password.value!==e.target.confirm.value){msg.textContent='As senhas não coincidem.';return}const b=e.target.querySelector('button');b.disabled=true;b.textContent='Criando acesso...';const r=await fetch('/paciente/auth/credenciais',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:e.target.identifier.value,password:e.target.password.value})}),x=await r.json().catch(()=>({}));b.disabled=false;b.textContent='Salvar e acessar meu portal';if(r.ok)location=x.redirect;else msg.textContent=x.detail||'Não foi possível criar seu acesso.'}</script>
