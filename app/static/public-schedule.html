<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendar consulta</title><style>body{margin:0;background:linear-gradient(145deg,#061126,#0b2030);color:#eff6ff;font:15px system-ui}.wrap{max-width:780px;margin:35px auto;padding:20px}.card{background:#101b30;border:1px solid #2b4268;border-radius:22px;padding:28px}.services,.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:15px 0}.option{padding:13px;border:1px solid #38527e;border-radius:11px;background:#13233d;color:white;cursor:pointer}.option.active{border-color:#5b8cff;background:#193b74}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;background:#081225;color:white;border:1px solid #38527e;border-radius:11px}button.submit{width:100%;padding:14px;border:0;border-radius:11px;background:linear-gradient(90deg,#3479ff,#7657f4);color:white;font-weight:800}.muted{color:#9caeca}.ok{color:#65e5b6}</style><link rel="stylesheet" href="/static/nutrios-premium.css"><link rel="stylesheet" href="/static/nutrios-reference-light-v15.css?v=15">
<link rel="stylesheet" href="/static/nutrios-unified-v17.css?v=17">
<link rel="stylesheet" href="/static/nutrios-no-blue-v18.css?v=18">
<link rel="stylesheet" href="/static/nutrios-exact-reference-v19.css?v=19">
</head><body class="patient-page"><main class="wrap"><section class="card"><h1>Escolha seu horário</h1><p class="muted">Os horários abaixo são disponibilizados diretamente pela clínica.</p><h3>Serviço</h3><div id="services" class="services"></div><h3>Horário</h3><div id="slots" class="slots"></div><input id="name" placeholder="Seu nome completo"><input id="phone" placeholder="WhatsApp com DDD"><button class="submit" id="submit">Confirmar agendamento</button><p id="msg"></p></section></main><script>
const slug=location.pathname.split('/')[2],sessionId=new URLSearchParams(location.search).get('session_id');let serviceId=null,startsAt=null;
async function load(){const [s,t]=await Promise.all([fetch(`/public/clientes/${slug}/services`).then(r=>r.json()),fetch(`/public/clientes/${slug}/slots`).then(r=>r.json())]);services.innerHTML=s.map(x=>`<button class="option" data-id="${x.id}"><b>${x.name}</b><br>R$ ${Number(x.price).toFixed(2)}</button>`).join('')||'<p class="muted">Serviço a combinar.</p>';slots.innerHTML=t.map(x=>`<button class="option" data-date="${x}">${new Date(x).toLocaleString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</button>`).join('')||'<p class="muted">Nenhum horário disponível no momento.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-id]').forEach(x=>x.classList.remove('active'));b.classList.add('active');serviceId=b.dataset.id});document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-date]').forEach(x=>x.classList.remove('active'));b.classList.add('active');startsAt=b.dataset.date})}
submit.onclick=async()=>{if(!sessionId||!startsAt||!name.value||!phone.value){msg.textContent='Preencha os dados e escolha um horário.';return}const r=await fetch(`/public/clientes/${slug}/appointments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,service_id:serviceId,starts_at:startsAt,patient_name:name.value,patient_phone:phone.value})});const x=await r.json().catch(()=>({}));msg.textContent=r.ok?'Consulta agendada com sucesso! A clínica também foi avisada.':x.detail||'Não foi possível agendar.';msg.className=r.ok?'ok':''};load();
</script><script src="/static/nutrios-theme-v17.js?v=17"></script>
</body></html>
