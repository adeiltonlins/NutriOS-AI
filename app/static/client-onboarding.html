<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Implantação — NutriOS</title><style>body{margin:0;background:#0b1a11;color:#e5f6ea;font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:28px}a{color:#e5f6ea;text-decoration:none}.hero,.panel{background:#12271a;border:1px solid #205f36;border-radius:19px;padding:22px;margin:20px 0}.bar{height:12px;background:#17301f;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#64cf86,#55dda9)}.check,.insight{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #17301f}.check:last-child,.insight:last-child{border:0}.done{color:#5be3b0}.todo{color:#ffca74}.btn{padding:8px 11px;border-radius:9px;background:#17301f;color:white;text-decoration:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:#64cf86}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:18px}}</style><link rel="stylesheet" href="/static/nutrios-premium.css">




<link rel="stylesheet" href="/static/nutrios-v22-unified.css?v=22">
</head><body><main class="wrap"><a href="/app">← Voltar</a><h1>Central de implantação</h1><section class="hero"><h2 id="progressText">Carregando...</h2><div class="bar"><div id="fill" class="fill"></div></div><p class="muted">Complete os passos para começar a divulgar seu assistente com segurança.</p></section><div class="grid"><section class="panel"><h2>Checklist</h2><div id="checks"></div></section><section class="panel"><h2>Quem chamar primeiro</h2><p class="muted">Priorização baseada na intenção demonstrada no chat.</p><div id="insights"></div></section></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,'');async function load(){const [o,i]=await Promise.all([fetch('/app/api/onboarding').then(r=>r.json()),fetch('/app/api/insights').then(r=>r.json())]);progressText.textContent=`${o.percentage}% configurado`;fill.style.width=o.percentage+'%';checks.innerHTML=o.checks.map(x=>`<div class="check"><span class="${x.done?'done':'todo'}">${x.done?'✓':'○'} ${esc(x.label)}</span><a class="btn" href="${x.href}">${x.done?'Revisar':'Configurar'}</a></div>`).join('');insights.innerHTML=i.map(x=>`<div class="insight"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.reason)} • ${x.score} pontos</div></div>${x.phone?`<a class="btn" target="_blank" href="https://wa.me/${String(x.phone).replace(/\D/g,'')}">WhatsApp</a>`:''}</div>`).join('')||'<p class="muted">Nenhum lead prioritário agora.</p>'}load()</script>
<script src="/static/nutrios-v22-theme.js?v=22"></script>
</body></html>
