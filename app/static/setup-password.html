<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crie sua senha — NutriOS</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1a11;color:#e5f6ea;font:16px system-ui}.card{width:min(92%,440px);padding:32px;background:#12271a;border:1px solid #205f36;border-radius:20px}p{color:#64cf86}label{display:block;margin:18px 0 7px}input{width:100%;padding:14px;background:#0b1a11;color:white;border:1px solid #205f36;border-radius:11px}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:11px;background:linear-gradient(90deg,#22ad55,#64cf86);color:white;font-weight:800}.msg{color:#ff92a5;min-height:20px}</style><link rel="stylesheet" href="/static/nutrios-premium.css">




<link rel="stylesheet" href="/static/nutrios-v22-unified.css?v=22">
<link rel="stylesheet" href="/static/nutrios-v23-polish.css?v=23">
</head><body class="login-page"><main class="card"><h1>Crie sua senha</h1><p>Este é seu primeiro acesso. A partir de agora, você entrará com seu identificador e esta senha enquanto seu plano estiver ativo.</p><form id="form"><label>Nova senha</label><input name="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"><label>Confirme a senha</label><input name="confirm" type="password" minlength="10" maxlength="128" required autocomplete="new-password"><p class="msg" id="msg"></p><button>Salvar e entrar</button></form></main><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#msg');m.textContent='';if(e.target.password.value!==e.target.confirm.value){m.textContent='As senhas não coincidem.';return}const r=await fetch('/app/primeiro-acesso',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:e.target.password.value})});if(r.ok)location='/app';else{const x=await r.json().catch(()=>({}));m.textContent=x.detail||'Não foi possível salvar.'}}</script>
<script src="/static/nutrios-v22-theme.js?v=22"></script>
</body></html>
