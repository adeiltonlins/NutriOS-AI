<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta • NutriOS-AI</title>
<link rel="stylesheet" href="/static/titanium.css"><link rel="stylesheet" href="/static/nutrios-premium.css"><link rel="stylesheet" href="/static/clinical-fixes.css"><link rel="stylesheet" href="/static/nutrios-design-system-v1.css?v=5">
<style>
:root{--ink:#12221a;--muted:#708078;--line:#e6ece8;--brand:#176b3b;--soft:#eff8f2}*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--brand)}h1{font-size:32px;margin:5px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:330px 1fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 30px rgba(24,60,40,.05)}.list{display:grid;gap:10px;max-height:720px;overflow:auto}.appt{padding:15px;border:1px solid var(--line);border-radius:16px;cursor:pointer}.appt.active{border-color:#7cc496;background:var(--soft)}.appt strong{display:block}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef5f0;font-size:11px;font-weight:800;margin-top:8px}.pill.online{background:#e9f5ff;color:#17619a}.pill.done{background:#eaf7ee;color:#176b3b}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:15px;border-radius:16px;background:#f8fbf9;border:1px solid var(--line)}.metric small{display:block;color:var(--muted)}.metric strong{font-size:18px}.context{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.card{border:1px solid var(--line);border-radius:18px;padding:17px}.answers{display:grid;gap:11px}.answer{padding:12px;border-radius:12px;background:#f8fbf9}.answer b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.notes{display:grid;gap:10px}textarea,input{width:100%;border:1px solid #dbe5df;border-radius:12px;padding:12px;font:inherit}textarea{min-height:92px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.button{border:0;border-radius:12px;padding:11px 15px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.button.secondary{background:#edf3ef;color:var(--ink)}.button.ai{background:#5c4ab1}.button.ai2{background:#8a5cf6}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.notice{padding:12px 14px;border-radius:12px;background:#fff7e5;color:#795b18;font-size:13px;margin-top:12px}.plan-grid{display:grid;gap:10px}.plan-meal{border:1px solid var(--line);border-radius:14px;padding:13px}.plan-meal h4{margin:0 0 8px}.food-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #eef2ef;font-size:13px}.food-row:last-child{border-bottom:0}.ai-panel{margin-top:16px;border-color:#d9cef8;background:#fbf9ff}.ai-title{display:flex;justify-content:space-between;gap:12px;align-items:center}.ai-title h3{margin:0}.status{font-size:12px;color:var(--muted)}@media(max-width:1000px){.grid,.context{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.shell{padding:16px}.metrics{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main class="shell">
<header class="top"><div><div class="eyebrow">NUTRIOS • CLINICAL FLOW</div><h1>Central de consultas</h1><p class="muted">Pré-consulta, atendimento online e plano alimentar no mesmo fluxo.</p></div><a class="button secondary" href="/app/clinica">← Dashboard</a></header>
<section class="grid">
<aside class="panel"><h2>Agenda</h2><p class="muted">Selecione uma consulta para abrir o atendimento.</p><div id="appointments" class="list"><div class="empty">Carregando consultas…</div></div></aside>
<section class="panel"><div id="workspace"><div class="empty"><h2>Escolha uma consulta</h2><p>O contexto do paciente e a pré-consulta aparecerão aqui.</p></div></div></section>
</section></main>
<script>
const $=s=>document.querySelector(s);let selected=null,context=null,aiPlan=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(!r.ok){let x={};try{x=await r.json()}catch{}throw new Error(x.detail||'Não foi possível concluir a ação.')}return r.json()}
function statusLabel(s){return ({scheduled:'Agendada',confirmed:'Confirmada',in_progress:'Em atendimento',completed:'Concluída',cancelled:'Cancelada',no_show:'Não compareceu'}[s]||'Agendada')}
function renderAppointments(rows){const el=$('#appointments');if(!rows.length){el.innerHTML='<div class="empty">Nenhuma consulta encontrada.</div>';return}el.innerHTML=rows.map(a=>{const date=a.starts_at?new Date(a.starts_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'Horário não informado';return `<article class="appt ${selected===a.id?'active':''}" onclick="openConsultation('${a.id}')"><strong>${esc(a.patient_name||'Paciente')}</strong><span class="muted">${esc(date)}</span><div><span class="pill ${a.consultation_mode==='online'?'online':''}">${a.consultation_mode==='online'?'Online':'Presencial'}</span> <span class="pill ${a.consultation_status==='completed'?'done':''}">${statusLabel(a.consultation_status)}</span></div></article>`}).join('')}
async function load(){try{const rows=await api('/app/api/consultas');renderAppointments(rows)}catch(e){$('#appointments').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function openConsultation(id){selected=id;aiPlan=null;const rows=await api('/app/api/consultas');renderAppointments(rows);context=await api('/app/api/consultas/'+id+'/contexto');renderWorkspace()}
function renderAiPlan(){if(!aiPlan)return '';const d=aiPlan;const meals=d.content||[];return `<div class="card ai-panel"><div class="ai-title"><h3>✨ Rascunho de plano alimentar com IA</h3><span class="status">Ainda não publicado</span></div><p><b>${esc(d.title||'Plano assistido')}</b><br>${esc(d.objective||'')}</p><div class="plan-grid">${meals.map(m=>`<div class="plan-meal"><h4>${esc(m.name||'Refeição')} ${m.time?`<span class="muted">• ${esc(m.time)}</span>`:''}</h4>${(m.items||[]).map(i=>`<div class="food-row"><span>${esc(i.name||'Alimento')}</span><b>${esc(i.grams||0)} g</b></div>`).join('')}</div>`).join('')}</div><div class="actions"><button class="button" onclick="saveAiPlan()">Usar no construtor</button><a class="button secondary" href="/app/pacientes/${encodeURIComponent(context.appointment.patient_id)}" target="_blank">Abrir construtor</a></div><div class="notice">A IA cria somente o rascunho. O construtor existente continua sendo a fonte de verdade para alimentos, quantidades, totais, edição e aprovação.</div></div>`}
function renderWorkspace(){const a=context.appointment,p=context.preconsultation,n=context.note;const answers=p?.answers||{};const labels={goal:'Objetivo',routine:'Rotina',preferences:'Preferências',restrictions:'Restrições',training:'Treino',sleep:'Sono',hydration:'Hidratação',difficulties:'Dificuldades',supplements:'Medicamentos/suplementos'};const answerHtml=Object.entries(answers).filter(([,v])=>String(v).trim()).map(([k,v])=>`<div class="answer"><b>${esc(labels[k]||k)}</b>${esc(v)}</div>`).join('')||'<div class="empty">A pré-consulta ainda não foi preenchida.</div>';const summary=p?.summary?.highlights||[];$('#workspace').innerHTML=`<div class="top"><div><div class="eyebrow">ATENDIMENTO</div><h2>${esc(a.patient_name||'Paciente')}</h2><span class="muted">${esc(a.starts_at?new Date(a.starts_at).toLocaleString('pt-BR',{dateStyle:'full',timeStyle:'short'}):'Horário não informado')}</span></div><div class="actions"><button class="button secondary" onclick="sendPre()">${p?'Pré-consulta criada':'Enviar pré-consulta'}</button>${a.consultation_mode==='online'&&a.meeting_url?`<a class="button" target="_blank" href="${esc(a.meeting_url)}">Entrar na consulta</a>`:`<button class="button secondary" onclick="makeRoom()">Ativar consulta online</button>`}<button class="button" onclick="startConsult()">Iniciar</button><button class="button secondary" onclick="finishConsult()">Concluir</button></div></div><div class="metrics"><div class="metric"><small>Modo</small><strong>${a.consultation_mode==='online'?'Online':'Presencial'}</strong></div><div class="metric"><small>Pré-consulta</small><strong>${p?.status==='completed'?'Preenchida':p?'Enviada':'Não enviada'}</strong></div><div class="metric"><small>Atendimento</small><strong>${statusLabel(a.consultation_status)}</strong></div><div class="metric"><small>Plano</small><strong>Construtor integrado</strong></div></div><div class="context"><div class="card"><h3>Resumo pré-consulta</h3>${summary.length?`<div class="answers">${summary.map(x=>`<div class="answer"><b>${esc(x.label)}</b>${esc(x.value)}</div>`).join('')}</div>`:'<div class="notice">O resumo será preenchido quando o paciente concluir o formulário.</div>'}<h3 style="margin-top:22px">Respostas completas</h3><div class="answers">${answerHtml}</div></div><div class="card"><h3>Registro clínico</h3><div class="notes"><label>Subjetivo<textarea id="subjective">${esc(n?.subjective||'')}</textarea></label><label>Objetivo<textarea id="objective">${esc(n?.objective||'')}</textarea></label><label>Avaliação<textarea id="assessment">${esc(n?.assessment||'')}</textarea></label><label>Plano<textarea id="plan">${esc(n?.plan||'')}</textarea></label></div><div class="actions"><button class="button" onclick="saveNotes()">Salvar registro</button><button class="button ai" onclick="aiAssist()">✨ Preparar resumo com IA</button><button class="button ai2" onclick="generateAiPlan()">🍽️ Gerar plano com IA</button></div><div id="aiBox"></div></div></div>${renderAiPlan()}`}
async function sendPre(){try{const x=await api('/app/api/consultas/'+selected+'/pre-consulta',{method:'POST'});context.preconsultation=x;renderWorkspace();alert('Pré-consulta criada. Link do paciente: '+location.origin+x.patient_link)}catch(e){alert(e.message)}}
async function makeRoom(){try{context.appointment=await api('/app/api/consultas/'+selected+'/sala',{method:'POST',body:JSON.stringify({mode:'online'})});renderWorkspace()}catch(e){alert(e.message)}}
async function startConsult(){try{context.appointment=await api('/app/api/consultas/'+selected+'/iniciar',{method:'POST'});renderWorkspace()}catch(e){alert(e.message)}}
async function finishConsult(){try{context.appointment=await api('/app/api/consultas/'+selected+'/concluir',{method:'POST'});renderWorkspace()}catch(e){alert(e.message)}}
async function saveNotes(){try{context.note=await api('/app/api/consultas/'+selected+'/notas',{method:'POST',body:JSON.stringify({subjective:$('#subjective').value,objective:$('#objective').value,assessment:$('#assessment').value,plan:$('#plan').value})});alert('Registro salvo.')}catch(e){alert(e.message)}}
function aiAssist(){const p=context.preconsultation;const h=p?.summary?.highlights||[];const box=$('#aiBox');if(!h.length){box.innerHTML='<div class="notice">Preencha a pré-consulta antes de preparar o resumo.</div>';return}box.innerHTML='<div class="answer" style="margin-top:12px"><b>Resumo assistido — revisar antes de usar</b>'+h.map(x=>esc(x.label)+': '+esc(x.value)).join(' • ')+'</div>'}
async function generateAiPlan(){const a=context.appointment;try{const btn=document.querySelector('.button.ai2');if(btn)btn.textContent='Gerando…';const x=await api('/app/api/pacientes/'+encodeURIComponent(a.patient_id)+'/planos/ia-rascunho',{method:'POST',body:JSON.stringify({meals_count:5,notes:$('#plan')?.value||''})});aiPlan=x.draft;renderWorkspace()}catch(e){alert(e.message);renderWorkspace()}}
async function saveAiPlan(){if(!aiPlan)return;try{const x=await api('/app/api/pacientes/'+encodeURIComponent(context.appointment.patient_id)+'/planos/ia-rascunho/salvar',{method:'POST',body:JSON.stringify({draft:aiPlan})});alert('Rascunho criado no construtor. Agora revise os alimentos e quantidades antes de aprovar.');window.open(x.builder_url,'_blank')}catch(e){alert(e.message)}}
load();
</script></body></html>
