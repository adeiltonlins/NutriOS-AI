<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendas e métricas — NutriOS</title>
<link rel="stylesheet" href="/static/nutrios-design-system-v1.css?v=4"><style>
body{margin:0;background:#0b1a11;color:#e5f6ea;font:15px system-ui}.wrap{max-width:1180px;margin:auto;padding:28px}.back{display:inline-flex;margin-bottom:24px;color:#68df91;text-decoration:none}.top,.filters{display:flex;justify-content:space-between;align-items:center;gap:12px}.filters{justify-content:flex-end}.period{display:flex;gap:8px}.filters select,.filters button,.download{min-height:46px;background:#10271a;color:#eefbf2;border:1px solid #326d45;border-radius:12px;padding:10px 14px;font:inherit}.filters select{appearance:auto}.filters button{background:#43d477;color:#07170d;border:0;font-weight:750;cursor:pointer}.download{display:inline-flex;align-items:center;color:#68df91;text-decoration:none}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin:24px 0}.card,.panel{background:#12271a;border:1px solid #294a35;border-radius:17px;padding:20px}.card strong{font-size:27px;display:block;margin:5px 0}.muted{color:#a9bcb0}.positive{color:#51dfa7}.negative{color:#ff899a}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.bars{height:245px;display:flex;align-items:flex-end;gap:7px;border-bottom:1px solid #205f36;padding-top:20px}.bar{flex:1;min-width:7px;background:linear-gradient(#64cf86,#168f43);border-radius:6px 6px 0 0;position:relative}.bar:hover:after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#07170d;padding:6px;border-radius:6px;font-size:11px}.source{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #17301f}.source:last-child{border:0}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.filters{width:100%;justify-content:flex-start;flex-wrap:wrap}.wrap{padding:18px}}
</style></head><body><main class="wrap"><a class="back" href="/app">← Voltar</a><header class="top"><div><h1>Vendas e métricas</h1><div class="muted">Seu balancete comercial mensal</div></div><div class="filters"><div class="period"><select id="month" aria-label="Mês"></select><select id="year" aria-label="Ano"></select></div><button type="button" onclick="load()">Atualizar</button><a class="download" href="/app/api/metricas/exportar">Exportar CSV</a></div></header><section class="cards"><div class="card"><span class="muted">Faturamento</span><strong id="revenue">—</strong><small id="growth"></small></div><div class="card"><span class="muted">Vendas</span><strong id="sales">—</strong><small id="pending"></small></div><div class="card"><span class="muted">Ticket médio</span><strong id="ticket">—</strong></div><div class="card"><span class="muted">Conversão</span><strong id="conversion">—</strong></div><div class="card"><span class="muted">Conversas</span><strong id="conversations">—</strong></div><div class="card"><span class="muted">Agendamentos</span><strong id="scheduled">—</strong></div></section><section class="grid"><article class="panel"><h2>Vendas por dia</h2><div id="bars" class="bars"></div></article><article class="panel"><h2>Origem dos clientes</h2><div id="sources"></div></article></section></main><script>
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s).replace(/[&<>"']/g,''),now=new Date(),months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];month.innerHTML=months.map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}">${m}</option>`).join('');year.innerHTML=Array.from({length:7},(_,i)=>now.getFullYear()+2-i).map(y=>`<option>${y}</option>`).join('');month.value=String(now.getMonth()+1).padStart(2,'0');year.value=now.getFullYear();
async function load(){const period=year.value+'-'+month.value,r=await fetch('/app/api/metricas?month='+period);if(!r.ok){location='/login';return}const x=await r.json(),c=x.current;revenue.textContent=money(c.revenue);sales.textContent=c.sales;ticket.textContent=money(c.ticket_average);conversion.textContent=c.conversion_rate+'%';conversations.textContent=c.conversations;scheduled.textContent=c.scheduled;growth.textContent=(x.revenue_growth>=0?'▲ ':'▼ ')+Math.abs(x.revenue_growth)+'% comparado ao mês anterior';growth.className=x.revenue_growth>=0?'positive':'negative';const days=Object.entries(c.daily),max=Math.max(1,...days.map(([,v])=>v.revenue));bars.innerHTML=days.length?days.map(([d,v])=>`<div class="bar" style="height:${Math.max(5,v.revenue/max*100)}%" data-tip="${d.slice(8)} • ${money(v.revenue)}"></div>`).join(''):'<p class="muted">Nenhuma venda confirmada neste mês.</p>';const src=Object.entries(c.sources).sort((a,b)=>b[1]-a[1]);sources.innerHTML=src.length?src.map(([s,n])=>`<div class="source"><span>${esc(s)}</span><b>${n}</b></div>`).join(''):'<p class="muted">Nenhuma origem registrada.</p>'}load();
</script></body></html>
