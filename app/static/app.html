<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NutriBot AI</title><style>body{margin:0;background:#071020;color:#eef4ff;font:16px system-ui}.wrap{max-width:980px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center}.status{color:#53e6a8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-top:32px}.card{background:#111c33;border:1px solid #24365d;border-radius:18px;padding:24px;color:inherit;text-decoration:none}.card:hover{border-color:#558cff}button{background:none;color:#9db2d8;border:1px solid #344a73;border-radius:10px;padding:10px}</style></head><body><main class="wrap"><div class="top"><div><h1 id="hello">Olá</h1><div class="status">● Sistema ativo</div></div><button id="logout">Sair</button></div><section class="grid"><a class="card" href="/">💬<h2>Abrir Assistente</h2></a><a class="card" href="/app/leads">📈<h2>Meus Leads</h2></a><a class="card" href="/app/configuracoes">⚙️<h2>Configurações</h2></a></section></main><script>fetch('/api/me').then(r=>{if(!r.ok)location='/login';return r.json()}).then(x=>document.querySelector('#hello').textContent='Olá, '+x.name);document.querySelector('#logout').onclick=()=>fetch('/auth/logout',{method:'POST'}).then(()=>location='/login')</script></body></html>
