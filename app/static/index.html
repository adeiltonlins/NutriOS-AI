<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriBot AI — seu nutricionista com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: {
          brand: { DEFAULT: '#2563eb', dark: '#1d4ed8', soft: '#eff4ff' },
        },
        keyframes: {
          riseIn: { '0%': { opacity: 0, transform: 'translateY(10px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
          fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
          blink: { '0%,49%': { opacity: 1 }, '50%,100%': { opacity: 0 } },
          bounceDot: { '0%,60%,100%': { transform: 'translateY(0)', opacity: .35 }, '30%': { transform: 'translateY(-4px)', opacity: 1 } },
        },
        animation: {
          riseIn: 'riseIn .35s ease-out',
          fadeIn: 'fadeIn .4s ease-out',
          blink: 'blink 1s step-start infinite',
          bounceDot: 'bounceDot 1.1s ease-in-out infinite',
        },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Inter', sans-serif; }
  #conversation::-webkit-scrollbar { width: 7px; }
  #conversation::-webkit-scrollbar-thumb { background: theme('colors.slate.300'); border-radius: 8px; }
  .dark #conversation::-webkit-scrollbar-thumb { background: theme('colors.slate.700'); }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="h-full bg-gradient-to-b from-slate-50 to-slate-100 text-slate-900 dark:from-slate-950 dark:to-slate-900 dark:text-slate-100 transition-colors">

<div class="h-full max-w-3xl mx-auto flex flex-col p-3 sm:p-5">

  <!-- Top bar -->
  <header class="flex items-center justify-between mb-3 sm:mb-4 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand to-emerald-500 flex items-center justify-center shadow-sm shrink-0">
        <svg viewBox="0 0 24 24" class="w-5 h-5 text-white" fill="none">
          <path d="M12 3C8 3 5 6.5 5 10.8C5 15.6 8.5 19.5 12 21C15.5 19.5 19 15.6 19 10.8C19 6.5 16 3 12 3Z" fill="white" fill-opacity=".95"/>
          <path d="M12 7.5V14.5M9 10.5C9 10.5 9.8 12 12 12C14.2 12 15 10.5 15 10.5" stroke="#2563eb" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1 class="font-bold text-[15px] sm:text-base tracking-tight leading-tight">NutriBot AI</h1>
        <p class="hidden sm:block text-xs text-slate-500 dark:text-slate-400">Assistente virtual de nutrição</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="newChatBtn" title="Nova conversa" aria-label="Nova conversa"
        class="w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-300 flex items-center justify-center hover:bg-brand-soft hover:text-brand dark:hover:bg-slate-700 hover:border-brand-soft transition-colors">
        <svg viewBox="0 0 24 24" class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="themeToggle" title="Alternar tema" aria-label="Alternar tema"
        class="w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-300 flex items-center justify-center hover:bg-brand-soft hover:text-brand dark:hover:bg-slate-700 hover:border-brand-soft transition-colors">
        <svg viewBox="0 0 24 24" class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </header>

  <!-- Card -->
  <main class="flex-1 flex flex-col bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl shadow-slate-200/60 dark:shadow-black/30 overflow-hidden min-h-0">

    <div class="px-4 sm:px-5 py-3 border-b border-slate-100 dark:border-slate-800 flex items-center gap-2 shrink-0">
      <span class="w-2 h-2 rounded-full bg-emerald-500 ring-4 ring-emerald-50 dark:ring-emerald-500/10"></span>
      <span class="text-xs font-medium text-slate-500 dark:text-slate-400">Online — pronta para te ajudar agora</span>
    </div>

    <!-- Landing / empty state -->
    <div id="landing" class="flex-1 flex flex-col items-center justify-center px-6 py-10 text-center animate-fadeIn">
      <div class="w-14 h-14 rounded-2xl bg-brand-soft dark:bg-slate-800 flex items-center justify-center mb-5">
        <svg viewBox="0 0 24 24" class="w-6 h-6 text-brand dark:text-blue-400" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10l-1 8a4 4 0 0 1-4 4 4 4 0 0 1-4-4L7 4Z"/><path d="M5 4h14"/></svg>
      </div>
      <h2 class="text-2xl sm:text-[26px] font-extrabold tracking-tight mb-2">Seu nutricionista com IA</h2>
      <p class="text-sm sm:text-[15px] text-slate-500 dark:text-slate-400 max-w-sm mb-7">Pergunte sobre dietas, calorias e alimentação saudável.</p>

      <div class="grid grid-cols-2 gap-2.5 w-full max-w-sm">
        <button class="quick-action group text-left px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-brand hover:bg-brand-soft dark:hover:bg-slate-700 transition-colors shadow-sm"
          data-q="Pode me ajudar a montar uma dieta?">
          <span class="block text-[13px] font-semibold text-slate-800 dark:text-slate-100 group-hover:text-brand dark:group-hover:text-blue-400">Montar dieta</span>
        </button>
        <button class="quick-action group text-left px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-brand hover:bg-brand-soft dark:hover:bg-slate-700 transition-colors shadow-sm"
          data-q="Como calculo minhas calorias diárias?">
          <span class="block text-[13px] font-semibold text-slate-800 dark:text-slate-100 group-hover:text-brand dark:group-hover:text-blue-400">Calcular calorias</span>
        </button>
        <button class="quick-action group text-left px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-brand hover:bg-brand-soft dark:hover:bg-slate-700 transition-colors shadow-sm"
          data-q="O que preciso saber para ganhar massa muscular?">
          <span class="block text-[13px] font-semibold text-slate-800 dark:text-slate-100 group-hover:text-brand dark:group-hover:text-blue-400">Ganhar massa</span>
        </button>
        <button class="quick-action group text-left px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-brand hover:bg-brand-soft dark:hover:bg-slate-700 transition-colors shadow-sm"
          data-q="Como posso perder gordura de forma saudável?">
          <span class="block text-[13px] font-semibold text-slate-800 dark:text-slate-100 group-hover:text-brand dark:group-hover:text-blue-400">Perder gordura</span>
        </button>
      </div>
    </div>

    <!-- Conversation -->
    <div id="conversation" class="flex-1 hidden flex-col gap-4 overflow-y-auto px-4 sm:px-5 py-5"></div>

    <!-- Composer -->
    <div class="border-t border-slate-100 dark:border-slate-800 p-3 sm:p-4 bg-white dark:bg-slate-900 shrink-0">
      <form id="composer" class="flex items-end gap-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5 focus-within:border-brand focus-within:ring-4 focus-within:ring-brand-soft dark:focus-within:ring-blue-500/10 transition-shadow">
        <textarea id="pergunta" rows="1" maxlength="500"
          placeholder="Pergunte algo sobre sua dieta..."
          aria-label="Sua pergunta sobre nutrição"
          class="flex-1 resize-none bg-transparent outline-none text-[14.5px] py-2.5 max-h-28 placeholder:text-slate-400 dark:placeholder:text-slate-500"></textarea>
        <button type="submit" id="enviarBtn" aria-label="Enviar pergunta"
          class="w-9 h-9 shrink-0 rounded-lg bg-brand text-white flex items-center justify-center hover:bg-brand-dark active:scale-95 disabled:bg-slate-300 disabled:cursor-not-allowed transition-all">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
      <p class="text-center text-[11px] text-slate-400 dark:text-slate-500 mt-2">Informações baseadas em referências nutricionais confiáveis. Para um plano personalizado, converse com uma nutricionista.</p>
    </div>
  </main>
</div>

<script>
(() => {
  const API_URL = window.location.origin + '/chat';
  const CONTATO_URL = window.location.origin + '/contato';
  const STORAGE_KEY_SESSION = 'nutribot-session-id';
  const STORAGE_KEY_HISTORICO = 'nutribot-historico';

  function carregarHistoricoSalvo() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_HISTORICO);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function salvarHistorico() {
    try {
      localStorage.setItem(STORAGE_KEY_HISTORICO, JSON.stringify(historicoConversa));
    } catch (e) { /* localStorage indisponível/cheio — segue sem persistir */ }
  }

  // sessionId agora sobrevive a reload: só é gerado uma vez e reaproveitado
  // enquanto a conversa continuar (evita perder o vínculo com o lead/pagamento
  // quando o navegador mobile recarrega a aba sozinho ao voltar do background).
  let historicoConversa = carregarHistoricoSalvo();
  let sessionId = localStorage.getItem(STORAGE_KEY_SESSION) || crypto.randomUUID();
  localStorage.setItem(STORAGE_KEY_SESSION, sessionId);
  let pollInterval = null;
  let pollAttempts = 0;

  const landing = document.getElementById('landing');
  const conversation = document.getElementById('conversation');
  const composer = document.getElementById('composer');
  const input = document.getElementById('pergunta');
  const enviarBtn = document.getElementById('enviarBtn');
  const newChatBtn = document.getElementById('newChatBtn');
  const themeToggle = document.getElementById('themeToggle');

  /* ---- Tema ---- */
  function aplicarTema(tema) {
    document.documentElement.classList.toggle('dark', tema === 'dark');
    localStorage.setItem('nutribot-theme', tema);
  }
  aplicarTema(localStorage.getItem('nutribot-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  themeToggle.addEventListener('click', () => {
    aplicarTema(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
  });

  /* ---- Textarea auto-resize ---- */
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 112) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); composer.requestSubmit(); }
  });

  /* ---- Nova conversa ---- */
  function novaConversa() {
    historicoConversa = [];
    sessionId = crypto.randomUUID();
    localStorage.setItem(STORAGE_KEY_SESSION, sessionId);
    localStorage.removeItem(STORAGE_KEY_HISTORICO);
    pararPolling();
    conversation.innerHTML = '';
    conversation.classList.add('hidden');
    conversation.classList.remove('flex');
    landing.classList.remove('hidden');
  }
  newChatBtn.addEventListener('click', novaConversa);

  function mostrarChat() {
    if (!landing.classList.contains('hidden')) {
      landing.classList.add('hidden');
      conversation.classList.remove('hidden');
      conversation.classList.add('flex');
    }
  }

  const horaAgora = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  function linkify(texto) {
    const escapado = texto.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    return escapado.replace(/(https?:\/\/[^\s]+)/g, url =>
      `<a href="${url}" target="_blank" rel="noopener" class="underline font-semibold">${url}</a>`);
  }

  function criarLinha(autor) {
    const isUser = autor === 'user';
    const row = document.createElement('div');
    row.className = `flex gap-2.5 max-w-[90%] animate-riseIn ${isUser ? 'self-end flex-row-reverse' : 'self-start'}`;

    const avatar = document.createElement('div');
    avatar.className = `w-7 h-7 shrink-0 rounded-lg flex items-center justify-center text-[11px] font-bold text-white mt-0.5 ${isUser ? 'bg-slate-400 dark:bg-slate-600' : 'bg-gradient-to-br from-brand to-emerald-500'}`;
    avatar.textContent = isUser ? 'Eu' : 'NB';
    row.appendChild(avatar);

    const col = document.createElement('div');
    col.className = `flex flex-col min-w-0 ${isUser ? 'items-end' : 'items-start'}`;
    row.appendChild(col);

    conversation.appendChild(row);
    conversation.scrollTop = conversation.scrollHeight;
    return col;
  }

  function bolhaBase(isUser) {
    const bubble = document.createElement('div');
    bubble.className = isUser
      ? 'px-4 py-2.5 text-[14.5px] leading-relaxed shadow-sm bg-brand text-white rounded-2xl rounded-tr-sm break-words whitespace-pre-wrap'
      : 'px-4 py-2.5 text-[14.5px] leading-relaxed shadow-sm bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-2xl rounded-tl-sm break-words whitespace-pre-wrap';
    return bubble;
  }

  function adicionarTimestamp(col) {
    const ts = document.createElement('span');
    ts.className = 'text-[10px] text-slate-400 dark:text-slate-500 mt-1 px-1';
    ts.textContent = horaAgora();
    col.appendChild(ts);
  }

  function adicionarMensagemUsuario(texto) {
    const col = criarLinha('user');
    const bubble = bolhaBase(true);
    bubble.textContent = texto;
    col.appendChild(bubble);
    adicionarTimestamp(col);
  }

  /* ---- Efeito de digitação da resposta ---- */
  function digitarResposta(texto, onDone) {
    const col = criarLinha('bot');
    const bubble = bolhaBase(false);
    const cursor = document.createElement('span');
    cursor.className = 'inline-block w-[2px] h-[14px] bg-brand align-middle ml-0.5 animate-blink';
    bubble.appendChild(cursor);
    col.appendChild(bubble);

    let i = 0;
    const passo = Math.max(1, Math.floor(texto.length / 120));
    const intervalo = setInterval(() => {
      i = Math.min(texto.length, i + passo);
      bubble.innerHTML = linkify(texto.slice(0, i));
      bubble.appendChild(cursor);
      conversation.scrollTop = conversation.scrollHeight;
      if (i >= texto.length) {
        clearInterval(intervalo);
        cursor.remove();
        bubble.innerHTML = linkify(texto);
        adicionarTimestamp(col);
        onDone && onDone(col);
      }
    }, 12);
  }

  function adicionarFontes(col, fontes) {
    if (!fontes || fontes.length === 0) return;
    const wrap = document.createElement('div');
    wrap.className = 'flex flex-wrap gap-1.5 mt-1.5 px-1';
    fontes.forEach(f => {
      const tag = document.createElement('span');
      tag.className = 'text-[10px] font-medium text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/10 px-2 py-0.5 rounded-full';
      tag.textContent = f;
      wrap.appendChild(tag);
    });
    col.appendChild(wrap);
    conversation.scrollTop = conversation.scrollHeight;
  }

  function mostrarPensando() {
    const col = criarLinha('bot');
    col.id = 'thinkingCol';
    const bubble = document.createElement('div');
    bubble.className = 'flex items-center gap-1.5 px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-2xl rounded-tl-sm shadow-sm';
    bubble.innerHTML = `
      <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounceDot" style="animation-delay:0ms"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounceDot" style="animation-delay:150ms"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounceDot" style="animation-delay:300ms"></span>`;
    col.appendChild(bubble);
  }

  function removerPensando() {
    const el = document.getElementById('thinkingCol');
    if (el) el.remove();
  }

  function mostrarErro(texto) {
    const div = document.createElement('div');
    div.className = 'self-center text-[13px] text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 rounded-lg px-3 py-2 max-w-[90%] animate-fadeIn';
    div.textContent = texto;
    conversation.appendChild(div);
    conversation.scrollTop = conversation.scrollHeight;
  }

  function mostrarContatoLiberado(contato) {
    pararPolling();
    const col = criarLinha('bot');
    const bubble = document.createElement('div');
    bubble.className = 'px-4 py-3 text-[14.5px] leading-relaxed shadow-sm bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/20 rounded-2xl rounded-tl-sm';
    bubble.innerHTML = `<span class="font-semibold text-emerald-700 dark:text-emerald-400">✅ Pagamento confirmado!</span><br>Fale agora com sua nutricionista: ${linkify(contato)}`;
    col.appendChild(bubble);
    adicionarTimestamp(col);
    conversation.scrollTop = conversation.scrollHeight;
  }

  /* ---- Polling de liberação de contato pós-pagamento ---- */
  function detectarLinkPagamento(texto) {
    return /mercadopago\.com/i.test(texto);
  }

  function pararPolling() {
    if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
    pollAttempts = 0;
  }

  function iniciarPollingContato() {
    if (pollInterval) return;
    pollAttempts = 0;
    pollInterval = setInterval(async () => {
      pollAttempts++;
      if (pollAttempts > 100) { pararPolling(); return; } // ~10min de tentativas
      try {
        const resp = await fetch(`${CONTATO_URL}?session_id=${sessionId}`);
        if (!resp.ok) return;
        const dados = await resp.json();
        if (dados.liberado && dados.contato) mostrarContatoLiberado(dados.contato);
      } catch (e) { /* silencioso, tenta de novo no próximo ciclo */ }
    }, 6000);
  }

  /* ---- Envio ---- */
  async function enviarPergunta(pergunta) {
    mostrarChat();
    adicionarMensagemUsuario(pergunta);
    input.value = '';
    input.style.height = 'auto';
    enviarBtn.disabled = true;
    mostrarPensando();

    try {
      const resp = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pergunta, historico: historicoConversa, session_id: sessionId })
      });

      removerPensando();

      if (!resp.ok) {
        const erro = await resp.json().catch(() => ({}));
        mostrarErro('Não consegui responder agora. ' + (erro.detail ? erro.detail.slice(0, 140) : 'Tenta de novo em instantes.'));
        return;
      }

      const dados = await resp.json();
      digitarResposta(dados.resposta, (col) => {
        adicionarFontes(col, dados.fontes_utilizadas);
        if (detectarLinkPagamento(dados.resposta)) iniciarPollingContato();
      });

      historicoConversa.push({ autor: 'user', texto: pergunta });
      historicoConversa.push({ autor: 'bot', texto: dados.resposta });
      salvarHistorico();

    } catch (e) {
      removerPensando();
      mostrarErro('Não consegui me conectar ao servidor. Verifique sua internet e tente de novo.');
    } finally {
      enviarBtn.disabled = false;
      input.focus();
    }
  }

  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const pergunta = input.value.trim();
    if (!pergunta) return;
    enviarPergunta(pergunta);
  });

  document.querySelectorAll('.quick-action').forEach(btn => {
    btn.addEventListener('click', () => enviarPergunta(btn.dataset.q));
  });

  /* ---- Restaurar conversa após reload (ex: app voltou do background) ---- */
  function renderizarMensagemSalva(autor, texto) {
    const col = criarLinha(autor);
    const bubble = bolhaBase(autor === 'user');
    if (autor === 'user') bubble.textContent = texto;
    else bubble.innerHTML = linkify(texto);
    col.appendChild(bubble);
    adicionarTimestamp(col);
  }

  async function restaurarConversa() {
    if (historicoConversa.length === 0) return;
    mostrarChat();
    historicoConversa.forEach(m => renderizarMensagemSalva(m.autor, m.texto));

    // Enquanto a página estava fechada/recarregada o pagamento pode ter sido
    // aprovado — confere direto no backend antes de decidir se falta liberar.
    try {
      const resp = await fetch(`${CONTATO_URL}?session_id=${sessionId}`);
      if (resp.ok) {
        const dados = await resp.json();
        if (dados.liberado && dados.contato) {
          mostrarContatoLiberado(dados.contato);
          return;
        }
      }
    } catch (e) { /* segue sem bloquear a restauração */ }

    // Se a última resposta do bot já continha o link de pagamento e ainda
    // não foi liberado, retoma o polling que o reload tinha derrubado.
    const ultimaDoBot = [...historicoConversa].reverse().find(m => m.autor === 'bot');
    if (ultimaDoBot && detectarLinkPagamento(ultimaDoBot.texto)) {
      iniciarPollingContato();
    }
  }

  restaurarConversa();

})();
</script>

</body>
</html>
