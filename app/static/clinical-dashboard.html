<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard clínico — NutriBot AI</title><link rel="stylesheet" href="/static/titanium.css"><link rel="stylesheet" href="/static/clinical-fixes.css"></head><body><main class="wrap clinical-wrap"><a href="/app">← Central profissional</a><header class="top"><div><h1>Dashboard clínico</h1><p class="muted">Prioridades, agenda e evolução dos seus pacientes.</p></div><button onclick="load()">Atualizar dados</button></header><section class="metrics"><div class="metric"><span class="muted">Pacientes</span><b id="patients">—</b></div><div class="metric"><span class="muted">Ativos</span><b id="active">—</b></div><div class="metric"><span class="muted">Alertas abertos</span><b id="alertsCount">—</b></div><div class="metric"><span class="muted">Sem check-in</span><b id="missing">—</b></div><div class="metric"><span class="muted">Receita no mês</span><b id="income">—</b></div></section><div class="dashboard-grid"><section class="panel"><h2>Prioridades clínicas</h2><div id="alerts" class="list"></div></section><section class="panel"><h2>Próximas consultas</h2><div id="appointments" class="list"></div></section><section class="panel"><h2>Carteira de pacientes</h2><div id="patientList" class="list"></div></section><section class="panel"><h2>Planos recentes</h2><div id="plans" class="list"></div></section></div></main><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,''),fmt=s=>s?new Date(s).toLocaleString('pt-BR'):'—',empty='<div class="empty">Nenhum item.</div>';async function api(u,o={}){const r=await fetch(u,o),x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.detail||'Erro');return x}async function resolve(id){await api('/app/api/alertas/'+id+'/resolver',{method:'PATCH'});load()}async function load(){const d=await api('/app/api/dashboard-clinico'),m=d.metrics;patients.textContent=m.patients;active.textContent=m.active;alertsCount.textContent=m.open_alerts;missing.textContent=m.without_checkin;income.textContent=Number(m.monthly_income).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});alerts.innerHTML=d.alerts.map(x=>`<article class="item patient-row"><div><b class="severity-${x.severity}">${esc(x.title)}</b><small>${esc(x.patient_name)} • ${fmt(x.created_at)}</small></div><button onclick="resolve('${x.id}')">Resolver</button></article>`).join('')||empty;appointments.innerHTML=d.appointments.map(x=>`<article class="item"><b>${esc(x.patient_name)}</b><p>${fmt(x.starts_at)}</p></article>`).join('')||empty;patientList.innerHTML=d.patients.map(x=>`<a class="item patient-row" href="/app/pacientes/${x.id}"><div><b>${esc(x.name)}</b><small>Último acesso: ${fmt(x.last_seen_at)}</small></div><span class="pill">${x.active?'Ativo':'Inativo'}</span></a>`).join('')||empty;plans.innerHTML=d.plans.map(x=>`<article class="item"><b>${esc(x.title)}</b><small>${esc(x.patient_name)} • ${esc(x.status)} • ${fmt(x.created_at)}</small></article>`).join('')||empty}load().catch(e=>alert(e.message))</script></body></html>
