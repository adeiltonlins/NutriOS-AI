<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversas e oportunidades — NutriOS</title><style>body{margin:0;background:#071020;color:#eff5ff;font:15px system-ui}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}a{color:#8eaeff;text-decoration:none}.panel{margin-top:25px;background:#101a30;border:1px solid #293c62;border-radius:17px;overflow:hidden}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.stat{padding:16px 22px;background:#101a30;border:1px solid #293c62;border-radius:14px}.stat b{display:block;font-size:26px}.muted{color:#9baccc}.list{padding:15px}.lead{padding:18px;border-bottom:1px solid #253755}.lead:last-child{border:0}.tags,.actions{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.tag{padding:4px 8px;border-radius:20px;background:#18384a;color:#5be6b2}.tag.no{background:#35202a;color:#ff91a4}.empty{text-align:center;padding:55px;color:#9baccc}button,.btn{background:#172641;color:white;border:1px solid #345078;border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:650}.primary{background:#3569ef}.success{background:#126244}.warn{background:#72510e}@media(max-width:650px){.wrap{padding:18px}.top{align-items:flex-start}.lead{padding:15px}}</style><link rel="stylesheet" href="/static/nutrios-premium.css"><link rel="stylesheet" href="/static/nutrios-premium-v4.css?v=20260813"><link rel="stylesheet" href="/static/nutrios-green-premium-v13.css?v=13">
<link rel="stylesheet" href="/static/nutrios-reference-light-v15.css?v=15">
<link rel="stylesheet" href="/static/nutrios-unified-v17.css?v=17">
</head><body class="leads-page"><main class="wrap"><header class="top"><div><a href="/app">← Voltar</a><div class="eyebrow">COMERCIAL</div><h1>Conversas e oportunidades</h1><div class="muted">Acompanhe contatos, intenção de agendamento e pagamentos em um só lugar.</div></div><button onclick="load()">Atualizar</button></header><section class="stats"><div class="stat"><b id="total">—</b><span class="muted">Conversas</span></div><div class="stat"><b id="verify">—</b><span class="muted">Aguardando conferência</span></div><div class="stat"><b id="paid">—</b><span class="muted">Pagamentos confirmados</span></div></section><section class="panel"><div id="list" class="list">Carregando...</div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const labels={new:'Nova conversa',awaiting_payment:'Aguardando pagamento',awaiting_verification:'Aguardando conferência',payment_confirmed:'Pagamento confirmado',contacted:'Cliente contatado',anamnesis_sent:'Anamnese enviada',scheduled:'Consulta agendada'};let config={};
async function action(id,act){let amount=null;if(act==='confirm_payment'){const typed=prompt('Qual foi o valor recebido? Use 0 se quiser confirmar sem informar o valor.','0');if(typed===null)return null;amount=Number(String(typed).replace(',','.'));if(!Number.isFinite(amount)||amount<0){alert('Informe um valor válido.');return null}}const r=await fetch('/app/api/leads/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:act,amount})});if(!r.ok){alert((await r.json().catch(()=>({}))).detail||'Não foi possível atualizar.');return null}await load();return r.json()}
function message(v){const base=config.public_url||'',anamnese=config.anamnesis_url||`${base}/anamnese?session_id=${encodeURIComponent(v.session_id)}`,agenda=`${base}/agenda?session_id=${encodeURIComponent(v.session_id)}`;return (config.whatsapp_message_template||'Olá, {nome}! Aqui é {nutricionista}. Confirmei seu pagamento. Preencha sua anamnese: {link_anamnese}\nDepois escolha seu horário: {link_agenda}').replaceAll('{nome}',v.lead_name||'').replaceAll('{nutricionista}',config.nome||'sua nutricionista').replaceAll('{link_anamnese}',anamnese).replaceAll('{link_agenda}',agenda)}
async function whatsapp(id,phone,v){await action(id,'contacted');window.open('https://wa.me/'+encodeURIComponent(phone)+'?text='+encodeURIComponent(message(v)),'_blank','noopener')}
async function load(){const [r,c]=await Promise.all([fetch('/app/api/leads'),fetch('/app/api/configuracoes')]);if(!r.ok){location='/login';return}const x=await r.json();if(c.ok)config=(await c.json()).ai_config||{};document.querySelector('#total').textContent=x.length;document.querySelector('#verify').textContent=x.filter(v=>v.workflow_status==='awaiting_verification').length;document.querySelector('#paid').textContent=x.filter(v=>v.pago).length;document.querySelector('#list').innerHTML=x.length?x.map(v=>{const s=v.workflow_status||'new',phone=String(v.lead_phone||'').replace(/\D/g,'');return `<article class="lead"><b>${esc(v.lead_name||'Visitante')} • ${esc(labels[s]||s)}</b><div class="muted">${phone?'WhatsApp: +'+esc(phone):'WhatsApp ainda não informado'}</div><div class="tags"><span class="tag ${v.quis_agendar?'':'no'}">${v.quis_agendar?'Demonstrou interesse':'Em conversa'}</span><span class="tag ${v.pago?'':'no'}">${v.pago?'Pago':'Não confirmado'}</span><span class="tag">${esc(v.message_count||0)} mensagens</span></div><p>${esc(v.lead_summary||'Sem resumo disponível.')}</p><div class="actions">${s==='awaiting_verification'?`<button class="success" onclick="action('${esc(v.session_id)}','confirm_payment')">Confirmar pagamento</button>`:''}${phone&&['payment_confirmed','contacted','anamnesis_sent','scheduled'].includes(s)?`<button class="primary" onclick='whatsapp(${JSON.stringify(v.session_id)},${JSON.stringify(phone)},${JSON.stringify(v)})'>Chamar no WhatsApp</button>`:''}${['payment_confirmed','contacted'].includes(s)?`<button onclick="action('${esc(v.session_id)}','anamnesis_sent')">Anamnese enviada</button>`:''}${['payment_confirmed','contacted','anamnesis_sent'].includes(s)?`<button class="warn" onclick="action('${esc(v.session_id)}','scheduled')">Marcar como agendado</button>`:''}</div><span class="muted">Última atividade: ${esc((v.atualizado_em||'').slice(0,16).replace('T',' '))}</span></article>`}).join(''):'<div class="empty">Nenhum lead ainda. As novas conversas aparecerão aqui.</div>'}load();
</script><script src="/static/nutrios-theme-v17.js?v=17"></script>
</body></html>
