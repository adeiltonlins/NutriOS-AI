<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus Leads — NutriBot AI</title><style>body{margin:0;background:#071020;color:#eff5ff;font:15px system-ui}.wrap{max-width:1050px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}a{color:#8eaeff;text-decoration:none}.panel{margin-top:25px;background:#101a30;border:1px solid #293c62;border-radius:17px;overflow:hidden}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.stat{padding:16px 22px;background:#101a30;border:1px solid #293c62;border-radius:14px}.stat b{display:block;font-size:26px}.muted{color:#9baccc}.list{padding:15px}.lead{padding:16px;border-bottom:1px solid #253755}.lead:last-child{border:0}.tags{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.tag{padding:4px 8px;border-radius:20px;background:#18384a;color:#5be6b2}.tag.no{background:#35202a;color:#ff91a4}.empty{text-align:center;padding:55px;color:#9baccc}button{background:#172641;color:white;border:1px solid #345078;border-radius:10px;padding:10px;cursor:pointer}</style></head><body><main class="wrap"><header class="top"><div><a href="/app">← Voltar</a><h1>Meus Leads</h1><div class="muted">Pessoas classificadas pelo seu assistente</div></div><button onclick="load()">Atualizar</button></header><section class="stats"><div class="stat"><b id="total">—</b><span class="muted">Conversas</span></div><div class="stat"><b id="interest">—</b><span class="muted">Qualificados</span></div><div class="stat"><b id="paid">—</b><span class="muted">Convertidos</span></div></section><section class="panel"><div id="list" class="list">Carregando...</div></section></main><script>const e=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const r=await fetch('/app/api/leads');if(!r.ok){location='/login';return}const x=await r.json();document.querySelector('#total').textContent=x.length;document.querySelector('#interest').textContent=x.filter(v=>['interessado','quente','convertido'].includes(v.lead_status)).length;document.querySelector('#paid').textContent=x.filter(v=>v.pago).length;document.querySelector('#list').innerHTML=x.length?x.map(v=>`<article class="lead"><b>${v.lead_status==='quente'?'🔥':v.lead_status==='interessado'?'🟡':v.lead_status==='convertido'?'✅':'⚪'} Lead ${e(v.lead_status||'dúvida')} • ${e(v.lead_score||0)} pontos</b><div class="tags"><span class="tag ${v.quis_agendar?'':'no'}">${v.quis_agendar?'Demonstrou interesse':'Sem agendamento'}</span><span class="tag ${v.pago?'':'no'}">${v.pago?'Pago':'Não pago'}</span><span class="tag">${e(v.message_count||0)} mensagens</span></div><p>${e(v.lead_summary||'Sem resumo disponível.')}</p><span class="muted">Última atividade: ${e((v.atualizado_em||'').slice(0,16).replace('T',' '))}</span></article>`).join(''):'<div class="empty">Nenhum lead ainda. As novas conversas feitas pelo seu assistente aparecerão aqui.</div>'}load()</script></body></html>
